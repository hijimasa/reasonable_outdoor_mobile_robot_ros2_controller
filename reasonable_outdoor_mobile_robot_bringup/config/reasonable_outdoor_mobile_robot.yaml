controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    left_wheel_names  : ['left_wheel_joint']
    right_wheel_names : ['right_wheel_joint']

    # Track between the tyre contact patches, confirmed against CAD. The axle
    # mounts are at y = +/-0.1107, but the tyre sits 18.5 mm outboard of its
    # mount, so the wheels touch the ground at y = +/-0.1292. Using the mount
    # spacing (0.2214) instead makes odometry over-report every turn.
    wheel_separation : 0.2584
    wheel_radius : 0.095
    wheel_separation_multiplier : 1.0
    left_wheel_radius_multiplier : 1.0
    right_wheel_radius_multiplier : 1.0

    odom_frame_id: odom
    base_frame_id: base_link

    # The last entry is yaw. It was 1000.0, i.e. a standard deviation of 31 rad
    # and 31 rad/s -- a declaration that this odometry knows nothing at all about
    # heading. The EKF believed it: after an 8 s turn at 0.6 rad/s its own
    # estimate of the yaw rate had only reached 0.2, and the leftover took half a
    # minute to decay while the robot stood still and the estimate slid away
    # under it. Wheel odometry's instantaneous yaw rate is in fact good; it is
    # the INTEGRATED heading that drifts, and nothing fuses that.
    # z, roll and pitch keep 1e6: a planar robot's wheels really do say nothing
    # about them.
    pose_covariance_diagonal : [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.05]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    # The EKF in tsukuba_robot_localization owns odom -> base_link. Leaving this
    # true as well puts two publishers on the same transform, and consumers then
    # see whichever arrived last: raw wheel odometry half the time, the fused
    # estimate the other half. The wheel odometry is still published as a topic
    # and is the EKF's main input.
    enable_odom_tf: false

    cmd_vel_timeout: 3.0
    publish_limited_velocity: true
    velocity_rolling_window_size: 10

    # limits
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 0.4
    linear.x.min_acceleration: -0.4
    linear.x.max_jerk: 0.5
    linear.x.min_jerk: -0.5

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.max_acceleration: 0.8
    angular.z.min_acceleration: -0.8
    angular.z.max_jerk: 0.5
    angular.z.min_jerk: -0.5

